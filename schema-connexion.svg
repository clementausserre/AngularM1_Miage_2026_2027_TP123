<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc">
<title id="title">Déroulement de la connexion</title>
<desc id="desc">Du clic sur Se connecter à la validation, la requête API, l’enregistrement de la session et la redirection. Les erreurs de formulaire et de connexion permettent de réessayer. Un 401 ultérieur efface la session.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#416658"/></marker></defs>
<rect width="1200" height="1440" fill="#f3f7f5"/>
<g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#17312a">
<text x="600" y="48" font-size="30" font-weight="700">Que se passe-t-il quand je me connecte ?</text>
<text x="600" y="77" font-size="16">Angular · formulaire réactif · API · session</text>
<rect x="260" y="100" width="460" height="64" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="127" font-size="18" font-weight="600">Clic sur « Se connecter »</text><text x="490" y="149" font-size="16" font-weight="400">Le composant appelle submit()</text><rect x="260" y="215" width="460" height="64" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="242" font-size="18" font-weight="600">Validation du formulaire</text><text x="490" y="264" font-size="16" font-weight="400">Email valide et mot de passe renseigné ?</text><rect x="785" y="215" width="365" height="82" rx="13" fill="#fff2f0" stroke="#b74b40" stroke-width="2"/><text x="967.5" y="240" font-size="18" font-weight="600">Formulaire invalide</text><text x="967.5" y="262" font-size="16" font-weight="400">Erreurs sous les champs</text><text x="967.5" y="284" font-size="16" font-weight="400">Aucune requête envoyée</text><rect x="260" y="335" width="460" height="70" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="365" font-size="18" font-weight="600">Connexion en cours…</text><text x="490" y="387" font-size="16" font-weight="400">Champs et bouton désactivés</text><rect x="260" y="455" width="460" height="70" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="485" font-size="18" font-weight="600">AuthService.login(email, password)</text><text x="490" y="507" font-size="16" font-weight="400">POST /api/auth/login</text><rect x="260" y="575" width="460" height="70" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="605" font-size="18" font-weight="600">Le serveur vérifie les identifiants</text><text x="490" y="627" font-size="16" font-weight="400">Email et mot de passe corrects ?</text><rect x="785" y="575" width="365" height="92" rx="13" fill="#fff2f0" stroke="#b74b40" stroke-width="2"/><text x="967.5" y="605" font-size="18" font-weight="600">Échec de connexion</text><text x="967.5" y="627" font-size="16" font-weight="400">Message d’erreur compréhensible</text><text x="967.5" y="649" font-size="16" font-weight="400">Formulaire réactivé pour réessayer</text><rect x="260" y="700" width="460" height="70" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="730" font-size="18" font-weight="600">Le serveur renvoie la session</text><text x="490" y="752" font-size="16" font-weight="400">Réponse : token + utilisateur</text><rect x="260" y="820" width="460" height="85" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="846.5" font-size="18" font-weight="600">AuthService enregistre la session</text><text x="490" y="868.5" font-size="16" font-weight="400">Token → localStorage et signal token</text><text x="490" y="890.5" font-size="16" font-weight="400">Utilisateur → signal currentUser</text><rect x="260" y="960" width="460" height="85" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="986.5" font-size="18" font-weight="600">Redirection vers /tracks</text><text x="490" y="1008.5" font-size="16" font-weight="400">Le guard autorise l’accès avec le token</text><text x="490" y="1030.5" font-size="16" font-weight="400">La navigation affiche « Déconnexion »</text><rect x="260" y="1150" width="460" height="80" rx="13" fill="white" stroke="#70a08d" stroke-width="2"/><text x="490" y="1174" font-size="18" font-weight="600">Requêtes suivantes vers l’API protégée</text><text x="490" y="1196" font-size="16" font-weight="400">L’intercepteur ajoute l’en-tête</text><text x="490" y="1218" font-size="16" font-weight="400">Authorization: Bearer &lt;token&gt;</text><rect x="260" y="1290" width="460" height="85" rx="13" fill="#fff2f0" stroke="#b74b40" stroke-width="2"/><text x="490" y="1316.5" font-size="18" font-weight="600">Si le serveur répond 401</text><text x="490" y="1338.5" font-size="16" font-weight="400">Suppression du token et de l’utilisateur</text><text x="490" y="1360.5" font-size="16" font-weight="400">Redirection vers /login</text><path d="M490 164 V209" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 279 V329" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="312" font-size="15">Oui</text><path d="M490 405 V449" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 525 V569" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 645 V694" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="677.5" font-size="15">Oui</text><path d="M490 770 V814" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 905 V954" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 1045 V1144" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 1230 V1284" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><text x="518" y="1265" font-size="15">401</text><path d="M720 247 H778" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><text x="751" y="235" font-size="15">Non</text><path d="M720 610 H778" fill="none" stroke="#416658" stroke-width="2" marker-end="url(#arrow)"/><text x="751" y="598" font-size="15">Non</text><text x="945" y="715" font-size="15">Un 401 à la connexion affiche une erreur :</text><text x="945" y="739" font-size="15">« Email ou mot de passe incorrect ».</text><text x="945" y="763" font-size="15">Il ne déclenche pas de redirection.</text>
<rect x="296" y="1084" width="388" height="28" rx="14" fill="#e2ede7"/><text x="490" y="1104" font-size="16">Une fois connecté</text>
<text x="600" y="1420" font-size="14">Le guard contrôle la navigation ; le serveur vérifie le token lors des requêtes protégées.</text>
</g></svg>
