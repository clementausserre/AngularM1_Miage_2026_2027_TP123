<div class="cover" aria-hidden="true">
  @if (url() && !failed()) {
    <img [src]="url()" alt="" width="800" height="800" (error)="failed.set(true)" />
  } @else {
    <svg class="note" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M9 17V6l11-2v11M9 9l11-2" /><ellipse cx="6" cy="18" rx="3" ry="2.5" /><ellipse cx="17" cy="16" rx="3" ry="2.5" /></svg>
    <span class="caption">{{ loading() ? 'Chargement…' : failed() ? 'Image indisponible' : 'Sans couverture' }}</span>
  }
</div>
