<header>
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M9 17V6l11-2v11M9 9l11-2" />
        <ellipse cx="6" cy="18" rx="3" ry="2.5" /><ellipse cx="17" cy="16" rx="3" ry="2.5" />
      </svg>
    </span>
    <div class="brand-text">
      <b>Guitar Practice Cloud</b>
      <small>Le cloud qui manque à votre ampli</small>
    </div>
  </div>
  <nav aria-label="Navigation principale">
    @if (auth.token()) {
      <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Backing tracks</a>
      <a routerLink="/playlists" routerLinkActive="active" ariaCurrentWhenActive="page">Playlists</a>
      <app-friends-nav />
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
      <button class="logout-button" type="button" (click)="logout()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 5H5v14h4M10 12h11m-4-4 4 4-4 4" />
        </svg>
        Déconnexion
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
<app-audio-player />
